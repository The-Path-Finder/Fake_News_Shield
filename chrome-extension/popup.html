<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake News Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <div class="kicker">Verification Extension</div>
          <h1>Fake News Shield</h1>
        </div>
        <span id="healthBadge" class="health-badge checking">Checking...</span>
      </header>

      <details class="settings">
        <summary>API Settings</summary>
        <div class="field">
          <label for="apiUrl">FastAPI Endpoint</label>
          <input id="apiUrl" type="url" value="http://localhost:8000" />
        </div>
      </details>

      <button id="scanBtn" class="scan-btn">Scan This Article</button>

      <div id="status" class="status hidden"></div>

      <div id="resultCard" class="result-card hidden">
        <div class="result-top">
          <div id="resultLabel" class="result-label"></div>
          <div id="resultConfidence" class="result-pct"></div>
        </div>
        <div class="meter-track">
          <div id="meterFill" class="meter-fill"></div>
        </div>
        <div id="resultMeta" class="result-meta"></div>
        <p id="resultRec" class="result-rec"></p>
        <p id="resultDisclaimer" class="disclaimer"></p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
